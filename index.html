<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game of Tones</title>
    <!-- Estilos limpios sin espacios -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Header y Botón Hamburguesa -->
    <header>
        <div class="logo">Surco</div>
        <button id="hamburger-btn" class="hamburger" aria-label="Abrir menú">
            ☰
        </button>
        <nav id="nav-menu" class="nav-menu">
            <ul>
                <!-- Slots del menú hamburguesa con atributos de navegación -->
                <li><a href="#" data-target="home">Inicio</a></li>
                <li><a href="#" data-target="notes">Notas</a></li>
                <li><a href="#" data-target="piano">Piano</a></li>
                <li><a href="#" data-target="artists">Artistas</a></li>
            </ul>
        </nav>
    </header>

    <!-- Contenedores / Secciones de tu app -->
    <main>
        <section id="home" class="view active">
            <h1>Escuchá la música desde adentro.</h1>
            <p>Aprendé las siete notas, tocalas en un piano y después metete en la vida de cuatro artistas que suenan fuerte en Argentina y Uruguay.</p>
            <button class="cta-btn" onclick="switchView('notes')">Empezar por las notas</button>
        </section>

        <section id="notes" class="view" style="display: none;">
            <!-- Contenido de notas -->
        </section>

        <section id="piano" class="view" style="display: none;">
            <!-- Contenido de piano -->
        </section>

        <section id="artists" class="view" style="display: none;">
            <!-- Contenido de artistas -->
        </section>
    </main>

    <!-- Scripts en orden correcto con defer -->
    <script src="data.js" defer></script>
    <script src="notes.js" defer></script>
    <script src="piano.js" defer></script>
    <script src="artists.js" defer></script>
    <script src="menu.js" defer></script>
</body>
</html>
